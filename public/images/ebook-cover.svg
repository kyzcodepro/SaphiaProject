  <text x="280" y="300" font-family="Georgia, serif" font-size="46" fill="#fbf7f2" text-anchor="middle">Reprendre</text>
  <text x="280" y="358" font-family="Georgia, serif" font-size="46" fill="#fbf7f2" text-anchor="middle">le contrôle</text>
